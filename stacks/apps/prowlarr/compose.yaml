---
# ─────────────────────────────────────────────────────────────
# prowlarr — indexer manager for the *arr suite
# Node: apps   Category: arr
# ─────────────────────────────────────────────────────────────
name: prowlarr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls165@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    container_name: prowlarr
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_DATA}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      homelab.managed: "true"
      homelab.node: "apps"
      homelab.stack: "prowlarr"
      homelab.category: "arr"
    networks:
      - default

networks:
  default:
    name: prowlarr
