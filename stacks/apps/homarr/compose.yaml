---
# ─────────────────────────────────────────────────────────────
# homarr — homelab dashboard
# Node: apps   Category: dashboard
# Mounts the docker socket (read-only) for container widgets.
# ─────────────────────────────────────────────────────────────
name: homarr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  homarr:
    <<: *common
    image: ghcr.io/homarr-labs/homarr:v2.0.0@sha256:3eeef80bfc58f6588844e9405da47550f681006d3019005a34f9388b5c00eb73
    container_name: homarr
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ}
      SECRET_ENCRYPTION_KEY: ${HOMARR_SECRET_ENCRYPTION_KEY}
    volumes:
      - ${DOCKER_DATA}/homarr:/appdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${HOMARR_PORT}:7575"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7575 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      homelab.managed: "true"
      homelab.node: "apps"
      homelab.stack: "homarr"
      homelab.category: "dashboard"
      diun.enable: "true"
    networks:
      - default

networks:
  default:
    name: homarr
