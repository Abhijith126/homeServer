---
# ─────────────────────────────────────────────────────────────
# uptime-kuma — self-hosted uptime & status monitoring
# Node: apps   Category: monitoring
# Deploy: docker compose up -d   (identical via CLI / Ansible / Portainer)
# ─────────────────────────────────────────────────────────────
name: uptime-kuma

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    container_name: uptime-kuma
    env_file:
      - path: .env
        required: false
    volumes:
      - ${DOCKER_DATA}/uptime-kuma:/app/data
    ports:
      - "${UPTIME_KUMA_PORT}:3001"
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      homelab.managed: "true"
      homelab.node: "apps"
      homelab.stack: "uptime-kuma"
      homelab.category: "monitoring"
      diun.enable: "true"
    networks:
      - default

networks:
  default:
    name: uptime-kuma
