---
# ─────────────────────────────────────────────────────────────
# bazarr — subtitle management for Sonarr/Radarr libraries
# Node: apps   Category: arr
# ─────────────────────────────────────────────────────────────
name: bazarr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls366@sha256:8b30e81c4aec2991f469e78fae8afaa89ecc9b21a80e3897f50427216b55470c
    container_name: bazarr
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_DATA}/bazarr:/config
      - ${MEDIA_ROOT}/Movies:/movies
      - ${MEDIA_ROOT}/Shows:/tv
    ports:
      - "${BAZARR_PORT}:6767"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6767 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      homelab.managed: "true"
      homelab.node: "apps"
      homelab.stack: "bazarr"
      homelab.category: "arr"
    networks:
      - default

networks:
  default:
    name: bazarr
