---
# ─────────────────────────────────────────────────────────────
# sonarr — TV series management
# Node: apps   Category: arr
# ─────────────────────────────────────────────────────────────
name: sonarr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326@sha256:f247545d23ba8b233d6604575347e48a623fe6ad75dda02348bf81917f3b5c06
    container_name: sonarr
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_DATA}/sonarr:/config
      - ${MEDIA_ROOT}/Downloads:/downloads
      - ${MEDIA_ROOT}/Shows:/tv
    ports:
      - "${SONARR_PORT}:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      homelab.managed: "true"
      homelab.node: "apps"
      homelab.stack: "sonarr"
      homelab.category: "arr"
      diun.enable: "true"
    networks:
      - default

networks:
  default:
    name: sonarr
