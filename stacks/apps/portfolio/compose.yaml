---
# ─────────────────────────────────────────────────────────────
# portfolio — personal website
# Node: apps   Category: web
# This image is BUILT from your own portfolio repo (not pulled from a
# registry here). Build & push it, then set PORTFOLIO_IMAGE in .env.
# ─────────────────────────────────────────────────────────────
name: portfolio

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  portfolio:
    <<: *common
    image: ${PORTFOLIO_IMAGE}
    container_name: portfolio
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORTFOLIO_PORT}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      homelab.managed: "true"
      homelab.node: "apps"
      homelab.stack: "portfolio"
      homelab.category: "web"
      diun.enable: "false"
    networks:
      - default

networks:
  default:
    name: portfolio
