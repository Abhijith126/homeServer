---
# ─────────────────────────────────────────────────────────────
# radarr — movie management
# Node: apps   Category: arr
# ─────────────────────────────────────────────────────────────
name: radarr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls319@sha256:7dfd049e79c00b16fbc29c3f5d96a9e7b9e73a23930b4c5b3c4541d60b366814
    container_name: radarr
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_DATA}/radarr:/config
      - ${MEDIA_ROOT}/Downloads:/downloads
      - ${MEDIA_ROOT}/Movies:/movies
    ports:
      - "${RADARR_PORT}:7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      homelab.managed: "true"
      homelab.node: "apps"
      homelab.stack: "radarr"
      homelab.category: "arr"
    networks:
      - default

networks:
  default:
    name: radarr
