---
# ─────────────────────────────────────────────────────────────
# prowlarr — indexer manager for the *arr suite
# Node: docker   Category: arr
# ─────────────────────────────────────────────────────────────
name: prowlarr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls166@sha256:04be30163fbaf48d6aeee7b5893c9f6614ffbad6d853971df0d6dcdf01c7f104
    container_name: prowlarr
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${DOCKER_DATA}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      homelab.managed: "true"
      homelab.node: "docker"
      homelab.stack: "prowlarr"
      homelab.category: "arr"
    networks:
      - default

networks:
  default:
    name: prowlarr
