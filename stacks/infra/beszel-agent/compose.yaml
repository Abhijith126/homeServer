---
# ─────────────────────────────────────────────────────────────
# beszel-agent — metrics agent for the Beszel hub
# Category: monitoring
# DEPLOY ON EVERY NODE (storage, apps, infra) — like a k8s DaemonSet.
# Uses host networking so it reports the host's real metrics.
# ─────────────────────────────────────────────────────────────
name: beszel-agent

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  beszel-agent:
    <<: *common
    image: henrygd/beszel-agent:0.21.0@sha256:f27b1aa2c68404bc5b9e1a2ab36653bd9b4ee14f6299862f09cd5051a4134767
    container_name: beszel-agent
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      LISTEN: ${BESZEL_AGENT_PORT}
      KEY: ${BESZEL_AGENT_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No healthcheck: the image is distroless (no shell/curl to run one).
    labels:
      homelab.managed: "true"
      homelab.stack: "beszel-agent"
      homelab.category: "monitoring"
