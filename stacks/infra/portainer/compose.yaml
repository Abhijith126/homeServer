---
# ─────────────────────────────────────────────────────────────
# portainer — Portainer BE management server (web UI + API)
# Node: infra   Category: management
# Manages this host's Docker via the local socket, and the remote
# nodes (apps, ryzen) through the portainer/agent deployed there by
# the Ansible portainer_agent role. Portainer is a convenience layer —
# the repo + `docker compose` remains the source of truth.
# ─────────────────────────────────────────────────────────────
name: portainer

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  portainer:
    <<: *common
    image: portainer/portainer-ee:2.45.3@sha256:8166e2376756d1ad3194e336cd1707c28a5764af7acc8bb9f21a5f28d1903566   # match the agent version in ansible group_vars
    container_name: portainer
    env_file:
      - path: .env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_DATA}/portainer:/data
    ports:
      - "${PORTAINER_PORT}:9443"   # HTTPS UI (self-signed; Caddy proxies with tls_insecure_skip_verify)
    # No healthcheck: the image is minimal (no shell/curl to run one).
    labels:
      homelab.managed: "true"
      homelab.node: "infra"
      homelab.stack: "portainer"
      homelab.category: "management"
    networks:
      - default

networks:
  default:
    name: portainer
