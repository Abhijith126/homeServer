---
# ─────────────────────────────────────────────────────────────
# immich — self-hosted photo & video backup
# Node: storage (ryzen)   Category: media
# Adapted from upstream release v3.0.3:
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
# Deploy: docker compose up -d
#
# Conventions applied: unless-stopped, json-file logging, homelab.* labels,
# ${VAR} paths. Upstream image healthchecks are kept (more accurate than a
# generic curl). Service names `redis`/`database` are preserved because immich
# resolves them by those hostnames.
# ─────────────────────────────────────────────────────────────
name: immich

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  immich-server:
    <<: *common
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich-server
    # Hardware-accelerated transcoding: see docs.immich.app + hwaccel.transcoding.yml
    volumes:
      - ${IMMICH_LIBRARY}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - path: .env
        required: false
    ports:
      - "${IMMICH_PORT}:2283"
    depends_on:
      - redis
      - database
    healthcheck:
      disable: false
    labels:
      homelab.managed: "true"
      homelab.node: "storage"
      homelab.stack: "immich"
      homelab.category: "media"

  immich-machine-learning:
    <<: *common
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION}
    container_name: immich-machine-learning
    # For accelerated inference add -[cuda|openvino|...] to the image tag.
    volumes:
      - model-cache:/cache
    env_file:
      - path: .env
        required: false
    healthcheck:
      disable: false
    labels:
      homelab.managed: "true"
      homelab.node: "storage"
      homelab.stack: "immich"
      homelab.category: "media"

  redis:
    <<: *common
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    container_name: immich-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      homelab.managed: "true"
      homelab.node: "storage"
      homelab.stack: "immich"
      homelab.category: "media"

  database:
    <<: *common
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-database
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DOCKER_DATA}/immich/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      disable: false
    labels:
      homelab.managed: "true"
      homelab.node: "storage"
      homelab.stack: "immich"
      homelab.category: "media"

volumes:
  model-cache:

networks:
  default:
    name: immich
