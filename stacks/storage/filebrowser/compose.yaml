---
# ─────────────────────────────────────────────────────────────
# filebrowser — web file manager over the storage array
# Node: storage (ryzen)   Category: files
# ─────────────────────────────────────────────────────────────
name: filebrowser

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  filebrowser:
    <<: *common
    image: filebrowser/filebrowser:v2.63.23@sha256:a469ea076d4a1b4b1d86a41d130f2f536cd9da996a2b1fb39c0d7635f9d89b9a
    container_name: filebrowser
    user: "${PUID}:${PGID}"
    env_file:
      - path: .env
        required: false
    environment:
      FB_DATABASE: /database/filebrowser.db
      FB_ROOT: /srv
      FB_PORT: "80"
      FB_ADDRESS: 0.0.0.0
    volumes:
      - ${DOCKER_DATA}/filebrowser:/database
      - ${FILEBROWSER_ROOT}:/srv
    ports:
      - "${FILEBROWSER_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      homelab.managed: "true"
      homelab.node: "storage"
      homelab.stack: "filebrowser"
      homelab.category: "files"
      diun.enable: "true"
    networks:
      - default

networks:
  default:
    name: filebrowser
