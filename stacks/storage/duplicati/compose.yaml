---
# ─────────────────────────────────────────────────────────────
# duplicati — encrypted, versioned backups
# Node: storage (ryzen)   Category: backup
# Backs up the NAS (/source, read-only) to the backup disk (/backups).
# ─────────────────────────────────────────────────────────────
name: duplicati

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true

services:
  duplicati:
    <<: *common
    image: lscr.io/linuxserver/duplicati:v2.3.0.4_stable_2026-07-09-ls301
    container_name: duplicati
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DUPLICATI__WEBSERVICE_PASSWORD: ${DUPLICATI_WEBSERVICE_PASSWORD}
      SETTINGS_ENCRYPTION_KEY: ${DUPLICATI_SETTINGS_ENCRYPTION_KEY}
      DUPLICATI__REQUIRE_DB_ENCRYPTION_KEY: "true"
    volumes:
      - ${DOCKER_DATA}/duplicati:/config
      - ${BACKUP_ROOT}:/backups
      - ${MEDIA_ROOT}:/source:ro
    ports:
      - "${DUPLICATI_PORT}:8200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      homelab.managed: "true"
      homelab.node: "storage"
      homelab.stack: "duplicati"
      homelab.category: "backup"
      diun.enable: "true"
    networks:
      - default

networks:
  default:
    name: duplicati
