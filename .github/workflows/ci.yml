---
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install linters
        run: |
          python -m pip install --quiet yamllint 'ansible>=11,<15'
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Run validation suite
        run: ./scripts/validate.sh

      - name: Test bootstrap, scheduling, and deployments
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate local provisioning playbook
        run: ansible-playbook -i localhost, ansible/bootstrap.yml --syntax-check
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg

      - name: Validate Caddy configuration with internal TLS
        run: |
          docker run --rm \
            -e DOMAIN=home.arpa \
            -e ACME_EMAIL=admin@example.invalid \
            -e STORAGE_HOST=10.10.0.10 \
            -e APPS_HOST=10.10.0.11 \
            -e INFRA_HOST=10.10.0.12 \
            -e CADDY_GLOBAL_OPTIONS=local_certs \
            -v "$PWD/stacks/infra/caddy/Caddyfile:/etc/Caddyfile:ro" \
            caddy:2.11.4 caddy adapt --config /etc/Caddyfile --validate

      # gitleaks-action is free for personal/public repositories.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  renovate-config:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:44.132.2@sha256:0191afbc3937e5316263426fc0ce1450f5c143d42e3f91da8c6f771e317fae51
      options: --user 0
    steps:
      - uses: actions/checkout@v7
      - name: Validate Renovate configuration
        run: renovate-config-validator --strict renovate.json
