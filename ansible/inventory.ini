# Homelab inventory. Replace ansible_host values with each node's LAN IP
# (use LAN IPs, not Tailscale names, so NFS + first-boot provisioning work
# before Tailscale is up).
[storage_nodes]
ryzen ansible_host=192.168.1.120

[app_nodes]
apps ansible_host=192.168.1.121

[infra_nodes]
infra ansible_host=192.168.1.122

[all:vars]
ansible_user=pjh10
ansible_python_interpreter=/usr/bin/python3
