---
# One-command host bootstrap.
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook site.yml                       # all nodes
#   ansible-playbook site.yml --limit apps          # one node
#   ansible-playbook site.yml --check --diff        # dry run
# Provide the Tailscale auth key at run time (never commit it):
#   ansible-playbook site.yml -e tailscale_authkey=tskey-auth-xxxx

- name: Base + Docker + Tailscale (all nodes)
  hosts: all
  become: true
  roles:
    - common
    - docker
    - tailscale

- name: NFS server (storage node)
  hosts: storage_nodes
  become: true
  roles:
    - nfs_server

- name: NFS clients (apps & infra)
  hosts: app_nodes:infra_nodes
  become: true
  roles:
    - nfs_client

# Nightly restic backup of /opt/homelab/data to the shared repo on hdd2.
# Runs after NFS so the backup mount exists on the clients.
- name: Backups (restic) — all nodes
  hosts: all
  become: true
  roles:
    - restic

# Portainer agent runs on the nodes managed remotely by the BE server (apps &
# storage). infra runs the BE server itself (stacks/infra/portainer) and manages
# its own Docker over the local socket, so it sets enable_portainer_agent=false.
- name: Portainer agent (managed nodes)
  hosts: all
  become: true
  roles:
    - portainer_agent
