---
# ryzen — storage node. Runs the NFS server + storage stacks.
# Firewall: NFS (2049/111) + service web UIs, from the LAN.
ufw_allow_tcp:
  - 111      # rpcbind (NFS)
  - 2049     # NFS
  - 2283     # immich
  - 8096     # jellyfin
  - 8082     # filebrowser
  - 8080     # qbittorrent (gluetun)
  - 9001     # portainer agent (managed by the BE server on infra)
  - 45876    # beszel-agent (scraped by the hub on infra)
ufw_allow_udp:
  - 111
  - 2049

# ryzen is managed remotely by the Portainer BE server (on infra) via the agent.
enable_portainer_agent: true
