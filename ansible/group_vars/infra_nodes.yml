---
# infra node — Debian 13. DNS, reverse proxy, monitoring.
docker_apt_release: bookworm       # Docker has no trixie suite yet
tailscale_apt_release: bookworm

# Free port 53 for Pi-hole (systemd-resolved binds it by default).
disable_resolved_stub: true

ufw_allow_tcp:
  - 53       # DNS
  - 80       # caddy (HTTP / ACME)
  - 443      # caddy (HTTPS)
  - 8081     # pihole web
  - 8090     # beszel
ufw_allow_udp:
  - 53       # DNS
